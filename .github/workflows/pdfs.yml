name: Publish PDFs
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5

      - name: Compile every main.typ
        run: |
          mkdir site
          while IFS= read -r -d '' src; do
            dir=$(dirname "$src")
            name=$(basename "$(realpath "$dir")")
            out="site/${dir#./}/$name.pdf"
            mkdir -p "$(dirname "$out")"
            typst compile --root . "$src" "$out"
          done < <(find . -name main.typ -not -path './site/*' -print0)

      - name: Generate index
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><title>Uni-Work PDFs</title><h1>Uni-Work PDFs</h1><ul>'
            (cd site && find . -name '*.pdf' | sort | sed 's|^\./||; s|.*|<li><a href="&">&</a></li>|')
            echo '</ul>'
          } > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
