name: Publish PDFs
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5

      - name: Compile main.typ and all.typ
        run: |
          mkdir site
          pattern='(^|/)Semestru-[^/]*/(.+)$'
          while IFS= read -r -d '' src; do
            dir=$(dirname "$src"); dir=${dir#./}

            # Path below the semester folder; fall back to the full path
            if [[ $dir =~ $pattern ]]; then rel=${BASH_REMATCH[2]}; else rel=$dir; fi
            [ "$rel" = "." ] && rel=$(basename "$PWD")

            name=${rel//\//-}; name=${name// /_}; name=${name,,}

            # only all-in-ones get the flag
            flags=()
            [ "$(basename "$src")" = "all.typ" ] && flags=(--input aio=true)

            out="site/$dir/$name.pdf"
            mkdir -p "$(dirname "$out")"
            typst compile --root . "${flags[@]}" "$src" "$out"
          done < <(find . \( -name main.typ -o -name all.typ \) -not -path './site/*' -print0)

      - name: Generate directory indexes
        run: bash .github/scripts/make-index.sh site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
